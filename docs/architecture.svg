<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" font-family="Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3D474F"/></marker></defs><rect width="1400" height="1040" fill="#FFFFFF"/><text x="40" y="52" font-size="26" font-weight="700" fill="#000000">CDR triage and respond</text><text x="40" y="78" font-size="14" fill="#3D474F">Falcon Fusion SOAR response to AWS cloud IOA detections: Charlotte AI picks every response with a confidence score, code checks it against the event, approval for anything disruptive.</text><rect x="40" y="90" width="120" height="4" fill="#EC0000"/><rect x="40" y="140" width="220" height="96" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="40" y="140" width="6" height="96" rx="3" fill="#61C4C9"/><text x="58" y="166" font-size="15" font-weight="700" fill="#000000">AWS account</text><text x="58" y="188" font-size="12.5" fill="#3D474F">CloudTrail API call, e.g.</text><text x="58" y="207" font-size="12.5" fill="#3D474F">AuthorizeSecurityGroupIngress</text><line x1="150" y1="236" x2="150" y2="290" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="40" y="290" width="220" height="96" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="40" y="290" width="6" height="96" rx="3" fill="#EC0000"/><text x="58" y="316" font-size="15" font-weight="700" fill="#000000">Falcon Cloud Security</text><text x="58" y="338" font-size="12.5" fill="#3D474F">CDR cloud IOA detection</text><text x="58" y="357" font-size="12.5" fill="#3D474F">Fusion trigger: FCS Detection</text><path d="M 260 338 C 295 338, 300 221, 328 221" fill="none" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="300" y="120" width="760" height="610" rx="10" fill="#F8F8F8" stroke="#EC0000" stroke-width="2"/><text x="320" y="146" font-size="13" font-weight="700" fill="#EC0000">FUSION SOAR WORKFLOW</text><rect x="330" y="165" width="300" height="112" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="330" y="165" width="6" height="112" rx="3" fill="#EC0000"/><text x="348" y="191" font-size="15" font-weight="700" fill="#000000">Route (Python step)</text><text x="348" y="213" font-size="12.5" fill="#3D474F">Trims the CloudTrail event. Nothing</text><text x="348" y="232" font-size="12.5" fill="#3D474F">here depends on the detection type,</text><text x="348" y="251" font-size="12.5" fill="#3D474F">so new CDR rules need no change.</text><rect x="660" y="172" width="370" height="98" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><text x="678" y="198" font-size="15" font-weight="700" fill="#3D474F">Stop, no case</text><text x="678" y="220" font-size="12.5" fill="#3D474F">Made by the CrowdStrike response role</text><text x="678" y="239" font-size="12.5" fill="#3D474F">(so containment is never undone), or the</text><text x="678" y="258" font-size="12.5" fill="#3D474F">LLM picked skip (Informational or Low only)</text><line x1="630" y1="221" x2="658" y2="221" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="330" y="330" width="300" height="150" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="330" y="330" width="6" height="150" rx="3" fill="#B52026"/><text x="348" y="356" font-size="15" font-weight="700" fill="#000000">Charlotte AI, then check (Python)</text><text x="348" y="378" font-size="12.5" fill="#3D474F">Picks action, target and confidence 0-100</text><text x="348" y="397" font-size="12.5" fill="#3D474F">from the action catalog. ~1,100 in / 55 out.</text><text x="348" y="416" font-size="12.5" fill="#3D474F">Check: target is the catalog&#x27;s event field,</text><text x="348" y="435" font-size="12.5" fill="#3D474F">the call succeeded, never SSO or root.</text><text x="348" y="454" font-size="12.5" fill="#3D474F">Fails a check → escalate-human.</text><line x1="480" y1="277" x2="480" y2="328" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><text x="488" y="307" font-size="12" font-style="italic" fill="#3D474F">every detection</text><rect x="680" y="330" width="350" height="130" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="680" y="330" width="6" height="130" rx="3" fill="#EC0000"/><text x="698" y="356" font-size="15" font-weight="700" fill="#000000">Falcon case</text><text x="698" y="378" font-size="12.5" fill="#3D474F">Action, target, how it was decided,</text><text x="698" y="397" font-size="12.5" fill="#3D474F">the target check and the trimmed event.</text><text x="698" y="416" font-size="12.5" fill="#3D474F">Severity from the detection.</text><text x="698" y="435" font-size="12.5" fill="#3D474F">monitor-only / escalate-human stop here.</text><line x1="630" y1="395" x2="678" y2="395" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="330" y="510" width="330" height="190" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="330" y="510" width="6" height="190" rx="3" fill="#EC0000"/><text x="348" y="536" font-size="15" font-weight="700" fill="#000000">Runs automatically (confidence ≥ 90)</text><text x="348" y="558" font-size="12.5" fill="#3D474F">Exact undo of the change:</text><text x="348" y="577" font-size="12.5" fill="#000000">• revoke internet ingress on the port</text><text x="348" y="596" font-size="12.5" fill="#000000">• make snapshot / AMI / RDS snapshot private</text><text x="348" y="615" font-size="12.5" fill="#000000">• turn on S3 Block Public Access</text><text x="348" y="634" font-size="12.5" fill="#000000">• remove the public EFS policy</text><text x="348" y="653" font-size="12.5" fill="#000000">• detach the admin policy (user, role, group)</text><text x="348" y="672" font-size="12.5" fill="#000000">• restart a trail; re-enable GuardDuty</text><text x="348" y="691" font-size="12.5" fill="#000000">• delete a new GuardDuty trusted IP set</text><rect x="690" y="510" width="340" height="190" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="690" y="510" width="6" height="190" rx="3" fill="#B52026"/><text x="708" y="536" font-size="15" font-weight="700" fill="#000000">Approval email, then run</text><text x="708" y="558" font-size="12.5" fill="#3D474F">Approve runs it; Decline comments the case:</text><text x="708" y="577" font-size="12.5" fill="#000000">• delete an inline admin policy</text><text x="708" y="596" font-size="12.5" fill="#000000">• disable an access key</text><text x="708" y="615" font-size="12.5" fill="#000000">• delete a login profile</text><text x="708" y="634" font-size="12.5" fill="#000000">• Lambda reserved concurrency 0</text><text x="708" y="653" font-size="12.5" fill="#000000">• reset an SNS topic policy to owner-only</text><text x="708" y="672" font-size="12.5" fill="#000000">• AWSDenyAll on an IAM user or role</text><line x1="780" y1="460" x2="495" y2="508" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><line x1="855" y1="460" x2="860" y2="508" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="1100" y="165" width="260" height="260" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="1100" y="165" width="6" height="260" rx="3" fill="#EC0000"/><text x="1118" y="191" font-size="15" font-weight="700" fill="#000000">Child workflows → Store apps</text><text x="1118" y="213" font-size="12.5" fill="#3D474F">CDR respond - IAM · EC2 · data stores</text><text x="1118" y="232" font-size="12.5" fill="#3D474F">· logging and detection: one</text><text x="1118" y="251" font-size="12.5" fill="#3D474F">condition, AWS step and case</text><text x="1118" y="270" font-size="12.5" fill="#3D474F">comment per action.</text><text x="1118" y="289" font-size="12.5" fill="#3D474F"></text><text x="1118" y="308" font-size="12.5" fill="#3D474F">EC2, S3, Lambda, EFS, RDS, SNS: one</text><text x="1118" y="327" font-size="12.5" fill="#3D474F">{account_id} config per app covers</text><text x="1118" y="346" font-size="12.5" fill="#3D474F">every account. Generic IAM undos,</text><text x="1118" y="365" font-size="12.5" fill="#3D474F">CloudTrail and GuardDuty need one</text><text x="1118" y="384" font-size="12.5" fill="#3D474F">per account (and region), else they</text><text x="1118" y="403" font-size="12.5" fill="#3D474F">fall back to a deny or an escalation.</text><path d="M 495 700 L 495 716 L 1074 716 Q 1080 716, 1080 710 L 1080 406 Q 1080 400, 1086 400 L 1098 400" fill="none" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><path d="M 1030 605 L 1080 605" fill="none" stroke="#3D474F" stroke-width="1.8"/><circle cx="1080" cy="605" r="3.5" fill="#3D474F"/><text x="1092" y="560" font-size="12" font-style="italic" fill="#3D474F" transform="rotate(-90 1092 560)">call child workflow</text><line x1="1230" y1="425" x2="1230" y2="480" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="1100" y="480" width="260" height="170" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="1100" y="480" width="6" height="170" rx="3" fill="#61C4C9"/><text x="1118" y="506" font-size="15" font-weight="700" fill="#000000">Every AWS account</text><text x="1118" y="528" font-size="12.5" fill="#3D474F">CrowdStrikeAutomatedResponse role</text><text x="1118" y="547" font-size="12.5" fill="#3D474F">(CloudFormation / StackSet: same</text><text x="1118" y="566" font-size="12.5" fill="#3D474F">role name and external ID), plus</text><text x="1118" y="585" font-size="12.5" fill="#3D474F">cfn/extra-response-permissions.yaml</text><text x="1118" y="604" font-size="12.5" fill="#3D474F">for CloudTrail and GuardDuty.</text><text x="1118" y="623" font-size="12.5" fill="#3D474F">Result is commented on the case.</text><text x="40" y="778" font-size="13" font-weight="700" fill="#EC0000">REPO TOOLING</text><rect x="40" y="792" width="300" height="96" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><text x="58" y="818" font-size="15" font-weight="700" fill="#000000">scripts/build-workflow.py</text><text x="58" y="840" font-size="12.5" fill="#3D474F">Action table, catalog and prompt; embeds</text><text x="58" y="859" font-size="12.5" fill="#3D474F">workflow/route.py and parse_llm.py</text><line x1="340" y1="840" x2="378" y2="840" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="380" y="792" width="300" height="96" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><text x="398" y="818" font-size="15" font-weight="700" fill="#000000">workflows/*.yaml</text><text x="398" y="840" font-size="12.5" fill="#3D474F">Generated: main workflow (13 actions)</text><text x="398" y="859" font-size="12.5" fill="#3D474F">+ 4 child workflows (42 actions), or</text><text x="398" y="878" font-size="12.5" fill="#3D474F">one self-contained workflow (51)</text><line x1="680" y1="840" x2="718" y2="840" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="720" y="792" width="300" height="96" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><text x="738" y="818" font-size="15" font-weight="700" fill="#000000">scripts/deploy.py</text><text x="738" y="840" font-size="12.5" fill="#3D474F">Fills Store config lookup, approver</text><text x="738" y="859" font-size="12.5" fill="#3D474F">and child IDs; imports + enables all 5</text><path d="M 870 792 C 870 760, 700 760, 700 732" fill="none" stroke="#3D474F" stroke-width="1.8" marker-end="url(#a)"/><rect x="40" y="910" width="470" height="96" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><text x="58" y="936" font-size="15" font-weight="700" fill="#000000">scripts/replay-detections.py + tests/*-events.json</text><text x="58" y="958" font-size="12.5" fill="#3D474F">Dry run on real and 58 sample events, scored per model</text><text x="58" y="977" font-size="12.5" fill="#3D474F">and confidence band, with consistency checks. No AWS action.</text><rect x="540" y="910" width="480" height="96" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><text x="558" y="936" font-size="15" font-weight="700" fill="#000000">scripts/simulate-detections.sh run | cleanup</text><text x="558" y="958" font-size="12.5" fill="#3D474F">Real detections from throwaway cdr-sim-* resources in a</text><text x="558" y="977" font-size="12.5" fill="#3D474F">sandbox account. Public-exposure scenarios are opt-in.</text><rect x="1100" y="792" width="260" height="214" rx="6" fill="#FFFFFF" stroke="#A7A9AC" stroke-width="1.5"/><rect x="1100" y="792" width="6" height="214" rx="3" fill="#B52026"/><text x="1118" y="818" font-size="15" font-weight="700" fill="#000000">Measured (GPT Latest)</text><text x="1118" y="840" font-size="12.5" fill="#3D474F">Samples: 86/86 over two runs</text><text x="1118" y="859" font-size="12.5" fill="#3D474F">Unseen detection types: 30/30</text><text x="1118" y="878" font-size="12.5" fill="#3D474F">Confidence ≥ 90: 110/110 right</text><text x="1118" y="897" font-size="12.5" fill="#3D474F">~1,100 in / 55 out tokens each</text><text x="1118" y="916" font-size="12.5" fill="#3D474F"></text><text x="1118" y="935" font-size="12.5" fill="#3D474F">Live tests: CDR rules from real</text><text x="1118" y="954" font-size="12.5" fill="#3D474F">detections, results checked in AWS</text></svg>
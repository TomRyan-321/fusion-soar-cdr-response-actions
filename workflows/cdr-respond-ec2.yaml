name: CDR respond - EC2
description: Called by 'CDR triage and respond'. Runs one EC2 response action in the detection's AWS account and comments
  the result on the case.
trigger:
  name: On demand
  type: On demand
  next:
  - is_sg_revoke_ingress
  - is_remove_public_snapshot
  - is_ami_make_private
  parameters:
    type: object
    properties:
      action:
        type: string
      target:
        type: string
      detail:
        type: string
      region:
        type: string
      port:
        type: integer
      account_id:
        type: string
      case_id:
        type: string
      mode:
        type: string
    required:
    - action
    - target
    - account_id
    - case_id
actions:
  RevokeIngress:
    id: c77fa1c6a29f47b3ad7bc282d6ea0fd6_f95438be914a49fba3aa12f6ff9c27da
    name: RevokeIngress
    next:
    - CommentRevokeIngress
    properties:
      config_id: __EC2_CONFIG_ID__
      account_id: ${data['account_id']}
      region: ${data['region']}
      security_group_id: ${data['target']}
      ports:
      - ${data['port']}
  CommentRevokeIngress:
    id: a16f4fdd1b244b0bfeecd47e25dbe0e0
    name: Add Comment to Case
    version_constraint: ~1
    properties:
      case_id: ${data['case_id']}
      comment: '${data[''mode'']}: sg-revoke-ingress on ${data[''target'']} ${data[''detail'']}: ${data[''RevokeIngress.removed_rules'']}'
  SnapshotPrivate:
    id: c77fa1c6a29f47b3ad7bc282d6ea0fd6_fe8d16164b8741689f672b8970243e0c
    name: SnapshotPrivate
    next:
    - CommentSnapshotPrivate
    properties:
      config_id: __EC2_CONFIG_ID__
      account_id: ${data['account_id']}
      region: ${data['region']}
      snapshot_id: ${data['target']}
  CommentSnapshotPrivate:
    id: a16f4fdd1b244b0bfeecd47e25dbe0e0
    name: Add Comment to Case
    version_constraint: ~1
    properties:
      case_id: ${data['case_id']}
      comment: '${data[''mode'']}: remove-public-snapshot on ${data[''target'']} ${data[''detail'']}: ${data[''SnapshotPrivate.message'']}'
  AmiPrivate:
    id: c77fa1c6a29f47b3ad7bc282d6ea0fd6_b0944cbf8d4148debd7fdb7416d7b85f
    name: AmiPrivate
    next:
    - CommentAmiPrivate
    properties:
      config_id: __EC2_CONFIG_ID__
      account_id: ${data['account_id']}
      region: ${data['region']}
      image_id: ${data['target']}
      attribute: launchPermission
      operation_type: remove
      user_groups:
      - all
  CommentAmiPrivate:
    id: a16f4fdd1b244b0bfeecd47e25dbe0e0
    name: Add Comment to Case
    version_constraint: ~1
    properties:
      case_id: ${data['case_id']}
      comment: '${data[''mode'']}: ami-make-private on ${data[''target'']} ${data[''detail'']}: ${data[''AmiPrivate.return'']}'
conditions:
  is_sg_revoke_ingress:
    next:
    - RevokeIngress
    expression: action:'sg-revoke-ingress'
    display:
    - sg-revoke-ingress
  is_remove_public_snapshot:

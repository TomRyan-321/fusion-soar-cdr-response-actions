    - AmiPrivate
    expression: WorkflowCustomVariable.Action:'ami-make-private'
    display:
    - ami-make-private
  is_s3_block_public_access:
    next:
    - S3BlockPublicAccess
    expression: WorkflowCustomVariable.Action:'s3-block-public-access'
    display:
    - s3-block-public-access
  is_lambda_disable:
    next:
    - LambdaDisable
    expression: WorkflowCustomVariable.Action:'lambda-disable'
    display:
    - lambda-disable
  is_efs_remove_public_access:
    next:
    - EfsRemovePublicAccess
    expression: WorkflowCustomVariable.Action:'efs-remove-public-access'
    display:
    - efs-remove-public-access
  is_rds_snapshot_private:
    next:
    - RdsSnapshotPrivate
    expression: WorkflowCustomVariable.Action:'rds-snapshot-private'
    display:
    - rds-snapshot-private
  is_sns_reset_topic_policy:
    next:
    - SnsResetTopicPolicy
    expression: WorkflowCustomVariable.Action:'sns-reset-topic-policy'
    display:
    - sns-reset-topic-policy
  is_cloudtrail_start_logging:
    next:
    - CloudTrailStartLogging
    expression: WorkflowCustomVariable.Action:'cloudtrail-start-logging'
    display:
    - cloudtrail-start-logging
  is_guardduty_enable_detector:
    next:
    - GuardDutyEnableDetector
    expression: WorkflowCustomVariable.Action:'guardduty-enable-detector'
    display:
    - guardduty-enable-detector
  is_guardduty_delete_ipset:
    next:
    - GuardDutyDeleteIpSet
    expression: WorkflowCustomVariable.Action:'guardduty-delete-ipset'
    display:
    - guardduty-delete-ipset

conditions:
  is_aws_cloud_ioa:
    next:
    - CreateVariable
    expression: Trigger.Detection.FCS.DetectType:'cloud-ioa'+Trigger.Detection.FCS.ServiceProvider:'aws'
    display:
    - AWS cloud IOA detection
  is_table:
    next:
    - CreateCase
    expression: WorkflowCustomVariable.Route:'table'
    display:
    - Fixed response for this API call
  is_llm:
    next:
    - RecommendAction
    expression: WorkflowCustomVariable.Route:'llm'
    display:
    - Needs a judgment call
  is_auto:
    next:
    - is_iam_disable_access_key
    - is_iam_apply_deny_policy_user
    - is_iam_role_apply_deny_policy
    - is_iam_detach_user_policy
    - is_iam_detach_role_policy
    - is_iam_detach_group_policy
    - is_iam_delete_user_policy
    - is_iam_delete_role_policy
    - is_iam_delete_group_policy
    - is_iam_delete_login_profile
    - is_sg_revoke_ingress
    - is_remove_public_snapshot
    - is_ami_make_private
    - is_s3_block_public_access
    - is_lambda_disable
    - is_efs_remove_public_access
    - is_rds_snapshot_private
    - is_sns_reset_topic_policy
    - is_cloudtrail_start_logging
    - is_guardduty_enable_detector
    - is_guardduty_delete_ipset
    expression: WorkflowCustomVariable.AutoRun:'yes'
    display:
    - Safe to run automatically
  is_needs_approval:
    next:
    - RequestApproval
    expression: WorkflowCustomVariable.AutoRun:'no'+WorkflowCustomVariable.Action:!'monitor-only'+WorkflowCustomVariable.Action:!'escalate-human'
    display:
    - Containment action that needs approval
  is_approved:
    next:
    - is_iam_disable_access_key
    - is_iam_apply_deny_policy_user
    - is_iam_role_apply_deny_policy
    - is_iam_detach_user_policy
    - is_iam_detach_role_policy
    - is_iam_detach_group_policy
    - is_iam_delete_user_policy
    - is_iam_delete_role_policy
    - is_iam_delete_group_policy
    - is_iam_delete_login_profile
    - is_sg_revoke_ingress
    - is_remove_public_snapshot
    - is_ami_make_private
    - is_s3_block_public_access
    - is_lambda_disable
    - is_efs_remove_public_access
    - is_rds_snapshot_private
    - is_sns_reset_topic_policy
    - is_cloudtrail_start_logging
    - is_guardduty_enable_detector
    - is_guardduty_delete_ipset
    expression: RequestApproval.result.user_response:'Approve'
    display:
    - Approved
  is_declined:
    next:
    - CommentNotApproved
    expression: RequestApproval.result.user_response:'Decline'
    display:
    - Declined
  is_iam_disable_access_key:
    next:
    - DisableAccessKey
    expression: WorkflowCustomVariable.Action:'iam-disable-access-key'
    display:
    - iam-disable-access-key
  is_iam_apply_deny_policy_user:
    next:
    - DenyUser
    expression: WorkflowCustomVariable.Action:'iam-apply-deny-policy-user'
    display:
    - iam-apply-deny-policy-user
  is_iam_role_apply_deny_policy:
    next:
    - DenyRole
    expression: WorkflowCustomVariable.Action:'iam-role-apply-deny-policy'
    display:
    - iam-role-apply-deny-policy
  is_iam_detach_user_policy:
    next:
    - DetachUserPolicy
    expression: WorkflowCustomVariable.Action:'iam-detach-user-policy'
    display:
    - iam-detach-user-policy
  is_iam_detach_role_policy:
    next:
    - DetachRolePolicy
    expression: WorkflowCustomVariable.Action:'iam-detach-role-policy'
    display:
    - iam-detach-role-policy
  is_iam_detach_group_policy:
    next:
    - DetachGroupPolicy
    expression: WorkflowCustomVariable.Action:'iam-detach-group-policy'
    display:
    - iam-detach-group-policy
  is_iam_delete_user_policy:
    next:
    - DeleteUserPolicy
    expression: WorkflowCustomVariable.Action:'iam-delete-user-policy'
    display:
    - iam-delete-user-policy
  is_iam_delete_role_policy:
    next:
    - DeleteRolePolicy
    expression: WorkflowCustomVariable.Action:'iam-delete-role-policy'
    display:
    - iam-delete-role-policy
  is_iam_delete_group_policy:
    next:
    - DeleteGroupPolicy
    expression: WorkflowCustomVariable.Action:'iam-delete-group-policy'
    display:
    - iam-delete-group-policy
  is_iam_delete_login_profile:
    next:
    - DeleteLoginProfile
    expression: WorkflowCustomVariable.Action:'iam-delete-login-profile'
    display:
    - iam-delete-login-profile
  is_sg_revoke_ingress:
    next:
    - RevokeIngress
    expression: WorkflowCustomVariable.Action:'sg-revoke-ingress'
    display:
    - sg-revoke-ingress
  is_remove_public_snapshot:
    next:
    - SnapshotPrivate
    expression: WorkflowCustomVariable.Action:'remove-public-snapshot'
    display:
    - remove-public-snapshot
  is_ami_make_private:

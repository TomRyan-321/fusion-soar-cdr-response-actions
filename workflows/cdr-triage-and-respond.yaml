# Generated by scripts/build-workflow.py. Edit that, not this file.
name: CDR triage and respond
description: On an AWS Falcon Cloud Security (CDR) cloud IOA detection, Charlotte AI picks a response from the action catalog
  with a confidence score; a Python check confirms its target is the right field of the CloudTrail event. Open a case. Exact
  undos of exposure and policy changes run automatically at high confidence; other actions run after email approval. Results
  are commented on the case.
trigger:
  next:
  - is_aws_cloud_ioa
  event: Investigatable
  name: Detection > FCS Detection
  type: Signal
  version_constraint: ~1
actions:
  CreateVariable:
    id: 702d15788dbbffdf0b68d8e2f3599aa4
    class: CreateVariable
    name: Create variable
    version_constraint: ~1
    next:
    - Route
    properties:
      variable_schema:
        type: object
        properties:
          Route:
            type: string
          Action:
            type: string
          Target:
            type: string
          Detail:
            type: string
          Region:
            type: string
          AutoRun:
            type: string
          Check:
            type: string
          Event:
            type: string
          Confidence:
            type: string
          Why:
            type: string
          Port:
            type: integer
  Route:
    id: 7fb9eb10b23943efaf1e6082b0ac0338
    class: Inline.Python
    name: Route detection
    version_constraint: ~1
    next:
    - SetRoute
    properties:
      runtime: py0313general
      script: |
        import json

        # Every detection goes to the LLM, with a trimmed CloudTrail event. The only rule here doesn't depend
        # on the detection type: a response action can itself raise a detection (attaching AWSDenyAll fires
        # "admin policy attached to role"), so skip anything CrowdStrike's response role did.
        LONG = 600  # longer request values (policy documents) are cut to this many characters

        e = json.loads(r'''${Trigger.Detection.FCS.RawEvent}''')
        ui = e.get("userIdentity") or {}
        caller = ui.get("arn") or ""


        def trim(value):
            if isinstance(value, dict):
                return {k: trim(v) for k, v in value.items() if v not in (None, "", [], {})}
            if isinstance(value, list):
                return [trim(v) for v in value]
            if isinstance(value, str) and len(value) > LONG:
                return value[:LONG] + "…"
            return value


        trimmed = {"eventName": e.get("eventName"), "eventSource": e.get("eventSource"), "awsRegion": e.get("awsRegion"),
                   "sourceIPAddress": e.get("sourceIPAddress"), "userAgent": e.get("userAgent"), "errorCode": e.get("errorCode"),
                   "userIdentity": {k: ui.get(k) for k in ("type", "arn", "userName", "accessKeyId") if ui.get(k)},
                   "requestParameters": e.get("requestParameters"), "responseElements": e.get("responseElements")}
        event = json.dumps(trim(trimmed), separators=(",", ":"), ensure_ascii=False)
        region = e.get("awsRegion") or "us-east-1"
        if "CrowdStrikeAutomatedResponse" in caller:
            route, check = "skip", "made by the CrowdStrike response role"
        else:
            route, check = "llm", ""
        print("|".join([route, region, check]) + "#EVENT#" + event, end="")
  SetRoute:
    id: 6c6eab39063fa3b72d98c82af60deb8a
    class: UpdateVariable
    name: Set route
    version_constraint: ~1
    next:
    - is_llm
    properties:
      WorkflowCustomVariable:
        Route: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[0]}
        Region: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[1]}
        Check: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[2]}
        Event: ${data['Route.output_stdout'].split('#EVENT#')[1]}
  RecommendAction:
    id: bdfecafafdb44919a458fcf51d6b93a7_98dec86072334d24b37dd798098cfd63
    name: Charlotte AI - LLM Completion
    version_constraint: ~0
    next:
    - ParseRecommendation
    properties:
      model_name: GPT Latest
      temperature: 0
      user_prompt: 'You respond to a CrowdStrike cloud detection in AWS. Pick ONE action from the list.

        1. Undo first: if the call exposed a resource, granted access or weakened a control, and an action undoes exactly
        that change on that resource, pick it, whoever the caller is.

        2. A call with an errorCode changed nothing: don''t undo it.

        3. When the detection is about the caller rather than the change (attack tools or a hacking OS in the userAgent, a
        malicious IP, instance credentials (session i-...) used outside their instance, or a call that is never routine),
        contain the caller, even if the call only read data.

        4. Don''t stretch an action to another resource type, an account-level setting or a deleted resource: escalate-human.

        5. Prefer monitor-only over an action that could break a deliberate setup (an admin role on an instance), and when
        nothing is exposed or contained (versioning or logging settings).

        Copy target, detail and port exactly from the event field named in [brackets].


        Actions:

        sg-revoke-ingress: remove a security group ingress rule open to 0.0.0.0/0 or ::/0 [target: groupId; port: fromPort]

        remove-public-snapshot: make an EBS snapshot shared with all accounts private [target: snapshotId]

        ami-make-private: remove public launch permission from an AMI [target: imageId]

        rds-snapshot-private: remove public restore permission from an RDS snapshot [target: dBSnapshotIdentifier]

        s3-block-public-access: turn on Block Public Access for one bucket made public by its ACL or policy, or whose block
        was removed [target: bucketName]

        efs-remove-public-access: remove public statements from an EFS file system policy [target: fileSystemId]

        sns-reset-topic-policy: replace an SNS topic policy opened to others with the owner-only default [target: topicArn]

        lambda-disable: set reserved concurrency 0 on a Lambda function made publicly invocable [target: functionName]

        cloudtrail-start-logging: start logging again on a CloudTrail trail that was stopped (StopLogging) [target: name]

        guardduty-enable-detector: re-enable a GuardDuty detector that was disabled, not deleted [target: detectorId]

        guardduty-delete-ipset: delete a newly created GuardDuty trusted IP set [target: detectorId; detail: ipSetId]

        iam-detach-user-policy: detach a managed policy that was attached to an IAM user [target: userName; detail: policyArn]

        iam-detach-role-policy: detach a managed policy that was attached to an IAM role [target: roleName; detail: policyArn]

        iam-detach-group-policy: detach a managed policy that was attached to an IAM group [target: groupName; detail: policyArn]

        iam-delete-user-policy: delete an inline policy that was put on an IAM user [target: userName; detail: policyName]

        iam-delete-role-policy: delete an inline policy that was put on an IAM role [target: roleName; detail: policyName]

        iam-delete-group-policy: delete an inline policy that was put on an IAM group [target: groupName; detail: policyName]

        iam-delete-login-profile: remove a console password that was created or changed for an IAM user [target: userName]

        iam-disable-access-key: deactivate an IAM user''s access key that was created or abused (target: the key''s user)
        [target: userName; detail: accessKeyId]

        iam-apply-deny-policy-user: attach AWSDenyAll to an IAM user [target: userName]

        iam-role-apply-deny-policy: attach AWSDenyAll to an IAM role: a malicious caller''s role, or a role whose trust policy
        was opened to others [target: roleName or the role in the caller ARN]

        monitor-only: open a case for the record: nothing to undo or contain

        escalate-human: open a case for a person: needed, but no action above fits, or the target is unclear (detail: what
        to look at)

        skip: no case: expected, low-risk activity (Informational or Low severity only)


        Detection: ${Trigger.Detection.Name} (${Trigger.Detection.SeverityDisplayName})

        ${Trigger.Detection.Description}

        Event: ${WorkflowCustomVariable.Event}


        Reply with only JSON: {"action":"","target":"","detail":"","port":0,"confidence":<0-100: how sure you are of action
        and target>,"why":"<=15 words"}'
  ParseRecommendation:
    id: 7fb9eb10b23943efaf1e6082b0ac0338
    class: Inline.Python
    name: Parse and check recommendation
    version_constraint: ~1
    next:
    - SetRecommendation
    properties:
      runtime: py0313general
      script: |
        import json

        # The action catalog from build-workflow.py: how each action runs and where its target must come from.
        CATALOG = json.loads(r'''{"sg-revoke-ingress":{"runs":"auto","kind":"undo","target":"groupId","port":"fromPort"},"remove-public-snapshot":{"runs":"auto","kind":"undo","target":"snapshotId"},"ami-make-private":{"runs":"auto","kind":"undo","target":"imageId"},"rds-snapshot-private":{"runs":"auto","kind":"undo","target":"dBSnapshotIdentifier"},"s3-block-public-access":{"runs":"auto","kind":"undo","target":"bucketName"},"efs-remove-public-access":{"runs":"auto","kind":"undo","target":"fileSystemId"},"sns-reset-topic-policy":{"runs":"approval","kind":"undo","target":"topicArn"},"lambda-disable":{"runs":"approval","kind":"undo","target":"functionName"},"cloudtrail-start-logging":{"runs":"auto","kind":"undo","target":"name","bound":["CLOUDTRAIL","escalate-human"]},"guardduty-enable-detector":{"runs":"auto","kind":"undo","target":"detectorId","bound":["GUARDDUTY","escalate-human"]},"guardduty-delete-ipset":{"runs":"auto","kind":"undo","target":"detectorId","detail":"ipSetId","bound":["GUARDDUTY","escalate-human"]},"iam-detach-user-policy":{"runs":"auto","kind":"undo","target":"userName","detail":"policyArn","bound":["IAM","iam-apply-deny-policy-user"]},"iam-detach-role-policy":{"runs":"auto","kind":"undo","target":"roleName","detail":"policyArn","bound":["IAM","iam-role-apply-deny-policy"]},"iam-detach-group-policy":{"runs":"auto","kind":"undo","target":"groupName","detail":"policyArn","bound":["IAM","escalate-human"]},"iam-delete-user-policy":{"runs":"approval","kind":"undo","target":"userName","detail":"policyName","bound":["IAM","iam-apply-deny-policy-user"]},"iam-delete-role-policy":{"runs":"approval","kind":"undo","target":"roleName","detail":"policyName","bound":["IAM","iam-role-apply-deny-policy"]},"iam-delete-group-policy":{"runs":"approval","kind":"undo","target":"groupName","detail":"policyName","bound":["IAM","escalate-human"]},"iam-delete-login-profile":{"runs":"approval","kind":"undo","target":"userName","bound":["IAM","iam-apply-deny-policy-user"]},"iam-disable-access-key":{"runs":"approval","kind":"contain","target":"userName","detail":"accessKeyId"},"iam-apply-deny-policy-user":{"runs":"approval","kind":"contain","target":"userName"},"iam-role-apply-deny-policy":{"runs":"approval","kind":"contain","target":["roleName","@role"]},"monitor-only":{"runs":"none"},"escalate-human":{"runs":"none","detail":""},"skip":{"runs":"none"}}''')
        AUTO_MIN = 90
        # Some Store actions have no account input (generic AWS IAM), or neither account nor region
        # (CloudTrail, GuardDuty): they act in their config's account and region, and an {account_id}
        # config doesn't work for them. deploy.py fills in which accounts (IAM) or account:region pairs
        # have their own config; anywhere else the catalog's fallback is used instead.
        BOUND = r'''__BOUND_CONFIGS__'''
        BOUND = None if BOUND.startswith("__") else json.loads(BOUND)
        APP_NAMES = {"IAM": "AWS IAM", "CLOUDTRAIL": "AWS CloudTrail", "GUARDDUTY": "AWS GuardDuty"}

        text = r'''${RecommendAction.FaaS.nlpassistantapi.llminvocator_handler.completion}'''
        event = r'''${WorkflowCustomVariable.Event}'''
        severity = "${Trigger.Detection.SeverityDisplayName}"
        account = "${Trigger.Detection.FCS.CloudAccountId}"
        region = "${WorkflowCustomVariable.Region}"

        # The last JSON object in the reply: some models think aloud and correct themselves after a first answer.
        r, i = {}, text.find("{")
        while i != -1:
            try:
                found, end = json.JSONDecoder().raw_decode(text, i)
                r, i = (found, text.find("{", end)) if isinstance(found, dict) and "action" in found else (r, text.find("{", i + 1))
            except ValueError:
                i = text.find("{", i + 1)
        e = json.loads(event)
        ui = e.get("userIdentity") or {}
        action = str(r.get("action") or "")
        target, detail = str(r.get("target") or "").strip(), str(r.get("detail") or "").strip()
        try:
            port = int(r.get("port") or 0)
        except (TypeError, ValueError):
            port = 0
        confidence = r.get("confidence")
        if isinstance(confidence, str):  # high/medium/low instead of a number: never enough to run on its own
            confidence = {"high": 80, "medium": 60, "low": 30}.get(confidence.lower(), confidence)
        try:
            confidence = float(confidence)
            confidence = max(0, min(100, round(confidence * 100 if 0 < confidence < 1 else confidence)))  # 0.9 means 90
        except (TypeError, ValueError):
            confidence = 0
        why = str(r.get("why") or "").replace("\n", " ")


        def values(x, key):
            """Every value of `key` anywhere in x. Newer APIs capitalize field names (GroupId, FromPort)."""
            if isinstance(x, dict):
                return [v for k, v in x.items() if k.lower() == key.lower()] + [w for v in x.values() for w in values(v, key)]
            return [w for v in x for w in values(v, key)] if isinstance(x, list) else []


        def matches(value, keys, scope):
            """True if value is the value of one of the event fields `keys` within scope."""
            keys = [keys] if isinstance(keys, str) else keys
            role = (ui.get("arn") or "").split("/")[1] if ui.get("type") == "AssumedRole" else None
            return any(str(value) == role if k == "@role" else str(value) in [str(v) for v in values(scope, k)] for k in keys)


        def check():
            """The reason the recommendation can't run as given, or None. Doesn't depend on the detection type."""
            spec = CATALOG.get(action)
            if not spec:
                return f"unknown action {action or '(none)'}"
            if action == "skip" and severity not in ("Informational", "Low"):
                return f"won't skip a {severity} detection"
            # An undo acts on what the call changed; containment may act on the caller too.
            undo = spec.get("kind") == "undo"
            scope = [e.get("requestParameters"), e.get("responseElements")] if undo else e
            for name, value in (("target", target), ("detail", detail), ("port", port)):
                keys = spec.get(name)
                if keys and not value:
                    return f"{action} needs a {name}"
                if keys and not matches(value, keys, scope):
                    where = "request or response" if undo else "event"
                    return f"{name} {value} isn't the {' or '.join([keys] if isinstance(keys, str) else keys)} in the {where}"
            if undo and e.get("errorCode"):
                return f"the call failed ({e['errorCode']}), so there is nothing to undo"
            if action.startswith("iam-") and target.startswith("AWSReservedSSO_"):
                return f"won't act on shared SSO role {target}"
            if spec.get("kind") == "contain" and ui.get("type") == "Root":
                return "won't contain the root user"
            return None


        problem = check()
        note = ""
        found = "target matches the event" if CATALOG.get(action, {}).get("target") else "no target needed"
        if problem:
            detail = f"{action} {target} {detail}".strip() if action not in ("escalate-human", "monitor-only") else detail
            action, target, port, confidence = "escalate-human", "-", 0, min(confidence, 50)
        elif CATALOG[action].get("bound") and BOUND is not None:
            app, fallback = CATALOG[action]["bound"]
            where = account if app == "IAM" else f"{account}:{region}"
            if where not in BOUND.get(app, []):
                note = f"; {action} needs an {APP_NAMES[app]} config for {where.replace(':', ' ')}, so {fallback} instead"
                if fallback == "escalate-human":
                    action, target, detail, port = fallback, "-", f"{action} {target} {detail}".strip(), 0
                else:
                    action, detail = fallback, ""
        if not CATALOG[action].get("target"):
            target = "-"
        if CATALOG[action].get("detail") is None:
            detail = ""
        if not CATALOG[action].get("port"):
            port = 0
        check_text = problem or found + note
        auto = "yes" if CATALOG[action]["runs"] == "auto" and confidence >= AUTO_MIN and not problem and not note else "no"
        fields = [action, target, detail, port, confidence, why, check_text, auto]
        print("|".join(str(f).replace("|", "") for f in fields), end="")
  SetRecommendation:
    id: 6c6eab39063fa3b72d98c82af60deb8a
    class: UpdateVariable
    name: Set recommendation
    version_constraint: ~1
    next:
    - is_case
    properties:
      WorkflowCustomVariable:
        Action: ${data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[0]}
        Target: ${data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[1]}
        Detail: ${data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[2]}
        Port: ${int(data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[3])}
        Confidence: ${data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[4]}
        Why: ${data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[5]}
        Check: ${data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[6]}
        AutoRun: ${data['ParseRecommendation.output_stdout'].split('#EVENT#')[0].split('|')[7]}
  CreateCase:
    id: 4918bf9d85ecc06388eca16543bdbbdc
    name: Create a new Case
    version_constraint: ~1
    next:
    - is_auto
    - is_needs_approval
    properties:
      name: 'CDR ${Trigger.Detection.Name}: ${WorkflowCustomVariable.Action} ${WorkflowCustomVariable.Target}'
      severity: '${{''Critical'': ''90'', ''High'': ''70'', ''Medium'': ''50'', ''Low'': ''30'', ''Informational'': ''10''}[data[''Trigger.Detection.SeverityDisplayName'']]}'
      status: new
      detections:
      - ${Trigger.Detection.DetectionID}
      tags:
      - cdr-soar
      description: '## Response


        **Action:** ${WorkflowCustomVariable.Action}


        **Target:** ${WorkflowCustomVariable.Target} ${WorkflowCustomVariable.Detail}


        **Decided by:** Charlotte AI (GPT Latest), confidence ${WorkflowCustomVariable.Confidence}/100. ${WorkflowCustomVariable.Why}


        **Check:** ${WorkflowCustomVariable.Check}


        **Runs:** ${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''automatically'' : ''after approval by __APPROVER_EMAIL__
        (containment actions only)''}


        Account ${Trigger.Detection.FCS.CloudAccountId}, region ${WorkflowCustomVariable.Region}.


        ## Event


        ```json

        ${WorkflowCustomVariable.Event}

        ```'
  RequestApproval:
    id: d6731c10b24834e2e0f4bd9d390a29c8
    name: Request human input - Send email
    version_constraint: ~1
    next:
    - is_approved
    - is_declined
    properties:
      to:
      - __APPROVER_EMAIL__
      responders:
      - __APPROVER_EMAIL__
      user_input_timeout: 24h
      allowed_responses:
      - Approve
      - Decline
      msg_type: text
      subject: 'Approve CDR response: ${WorkflowCustomVariable.Action} on ${WorkflowCustomVariable.Target}'
      msg: 'Falcon Cloud Security detected "${Trigger.Detection.Name}" in AWS account ${Trigger.Detection.FCS.CloudAccountId}.


        Action: ${WorkflowCustomVariable.Action}

        Target: ${WorkflowCustomVariable.Target} ${WorkflowCustomVariable.Detail}

        Region: ${WorkflowCustomVariable.Region}

        Decided by: Charlotte AI (GPT Latest), confidence ${WorkflowCustomVariable.Confidence}/100. ${WorkflowCustomVariable.Why}

        Check: ${WorkflowCustomVariable.Check}


        Approve to run it now. Details are on case ${data[''CreateCase.id'']}.'
  CommentNotApproved:
    id: a16f4fdd1b244b0bfeecd47e25dbe0e0
    name: Add Comment to Case
    version_constraint: ~1
    properties:
      case_id: ${data['CreateCase.id']}
      comment: 'Recommended ${WorkflowCustomVariable.Action} was not run: declined by ${data[''RequestApproval.result.responder'']}.
        ${data[''RequestApproval.result.note'']}'
  RespondIAM:
    id: __WORKFLOW_cdr-respond-iam__
    name: CDR respond - IAM
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
  RespondEC2:
    id: __WORKFLOW_cdr-respond-ec2__
    name: CDR respond - EC2
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
  RespondData:
    id: __WORKFLOW_cdr-respond-data__
    name: CDR respond - data stores
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
  RespondControls:
    id: __WORKFLOW_cdr-respond-controls__
    name: CDR respond - logging and detection
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
conditions:
  is_aws_cloud_ioa:
    next:
    - CreateVariable
    expression: Trigger.Detection.FCS.DetectType:'cloud-ioa'+Trigger.Detection.FCS.ServiceProvider:'aws'
    display:
    - AWS cloud IOA detection
  is_llm:
    next:
    - RecommendAction
    expression: WorkflowCustomVariable.Route:'llm'
    display:
    - Not made by the response role
  is_case:
    next:
    - CreateCase
    expression: WorkflowCustomVariable.Action:!'skip'
    display:
    - Worth a case
  is_auto:
    next: &id001
    - is_iam_response
    - is_ec2_response
    - is_data_response
    - is_controls_response
    expression: WorkflowCustomVariable.AutoRun:'yes'
    display:
    - Safe to run automatically
  is_needs_approval:
    next:
    - RequestApproval
    expression: WorkflowCustomVariable.AutoRun:'no'+WorkflowCustomVariable.Action:!'monitor-only'+WorkflowCustomVariable.Action:!'escalate-human'
    display:
    - Containment action that needs approval
  is_approved:
    next: *id001
    expression: RequestApproval.result.user_response:'Approve'
    display:
    - Approved
  is_declined:
    next:
    - CommentNotApproved
    expression: RequestApproval.result.user_response:'Decline'
    display:
    - Declined
  is_iam_response:
    next:
    - RespondIAM
    expression: WorkflowCustomVariable.Action:['iam-disable-access-key', 'iam-apply-deny-policy-user', 'iam-role-apply-deny-policy',
      'iam-detach-user-policy', 'iam-detach-role-policy', 'iam-detach-group-policy', 'iam-delete-user-policy', 'iam-delete-role-policy',
      'iam-delete-group-policy', 'iam-delete-login-profile']
    display:
    - IAM action
  is_ec2_response:
    next:
    - RespondEC2
    expression: WorkflowCustomVariable.Action:['sg-revoke-ingress', 'remove-public-snapshot', 'ami-make-private']
    display:
    - EC2 action
  is_data_response:
    next:
    - RespondData
    expression: WorkflowCustomVariable.Action:['s3-block-public-access', 'lambda-disable', 'efs-remove-public-access', 'rds-snapshot-private',
      'sns-reset-topic-policy']
    display:
    - data stores action
  is_controls_response:
    next:
    - RespondControls
    expression: WorkflowCustomVariable.Action:['cloudtrail-start-logging', 'guardduty-enable-detector', 'guardduty-delete-ipset']
    display:
    - logging and detection action

# Generated by scripts/build-workflow.py. Edit that, not this file.
name: CDR triage and respond
description: 'On an AWS Falcon Cloud Security (CDR) cloud IOA detection, pick a response: a fixed response for API calls with
  one obvious fix (target read straight from the CloudTrail event), otherwise a Charlotte AI LLM judgment whose target must
  appear in the event. Open a case. Exact undos of exposure and policy changes run automatically; other containment runs after
  email approval. Results are commented on the case.'
trigger:
  next:
  - is_aws_cloud_ioa
  event: Investigatable
  name: Detection > FCS Detection
  type: Signal
  version_constraint: ~1
actions:
  CreateVariable:
    id: 702d15788dbbffdf0b68d8e2f3599aa4
    class: CreateVariable
    name: Create variable
    version_constraint: ~1
    next:
    - Route
    properties:
      variable_schema:
        type: object
        properties:
          Route:
            type: string
          Action:
            type: string
          Target:
            type: string
          Detail:
            type: string
          Region:
            type: string
          AutoRun:
            type: string
          Check:
            type: string
          Event:
            type: string
          Confidence:
            type: string
          Why:
            type: string
          Port:
            type: integer
  Route:
    id: 7fb9eb10b23943efaf1e6082b0ac0338
    name: Route detection
    version_constraint: ~1
    next:
    - SetRoute
    properties:
      runtime: py0313general
      script: |
        import json

        AUTO = {"sg-revoke-ingress", "remove-public-snapshot", "ami-make-private", "iam-detach-user-policy",
                "iam-detach-role-policy", "iam-detach-group-policy", "s3-block-public-access",
                "efs-remove-public-access", "rds-snapshot-private", "cloudtrail-start-logging", "guardduty-enable-detector",
                "guardduty-delete-ipset"}
        PUBLIC = ("0.0.0.0/0", "::/0")
        # Some Store actions have no account input (generic AWS IAM), or neither account nor region
        # (CloudTrail, GuardDuty): they act in their config's account and region, and an {account_id}
        # config doesn't work for them. deploy.py fills in which accounts (IAM) or account:region pairs
        # have their own config; anywhere else use the fallback instead.
        BOUND = r'''__BOUND_CONFIGS__'''
        BOUND = None if BOUND.startswith("__") else json.loads(BOUND)
        ACCOUNT_BOUND = {"iam-detach-user-policy": ("IAM", "iam-apply-deny-policy-user"),
                         "iam-delete-user-policy": ("IAM", "iam-apply-deny-policy-user"),
                         "iam-delete-login-profile": ("IAM", "iam-apply-deny-policy-user"),
                         "iam-detach-role-policy": ("IAM", "iam-role-apply-deny-policy"),
                         "iam-delete-role-policy": ("IAM", "iam-role-apply-deny-policy"),
                         "iam-detach-group-policy": ("IAM", "escalate-human"), "iam-delete-group-policy": ("IAM", "escalate-human"),
                         "cloudtrail-start-logging": ("CLOUDTRAIL", "escalate-human"),
                         "guardduty-enable-detector": ("GUARDDUTY", "escalate-human"),
                         "guardduty-delete-ipset": ("GUARDDUTY", "escalate-human")}

        e = json.loads(r'''${Trigger.Detection.FCS.RawEvent}''')
        rp = e.get("requestParameters") or {}
        re_ = e.get("responseElements") or {}
        ui = e.get("userIdentity") or {}
        caller = ui.get("arn") or ""
        name = e.get("eventName") or ""
        source = e.get("eventSource") or ""
        # Lambda event names carry an API version: AddPermission20150331v2.
        api = name.rstrip("0123456789v") if source == "lambda.amazonaws.com" else name
        severity = "${Trigger.Detection.SeverityDisplayName}"
        detection = "${Trigger.Detection.Name}"
        account = "${Trigger.Detection.FCS.CloudAccountId}"


        def items(x):
            return (x or {}).get("items") or []


        def public_port():
            for perm in items(rp.get("ipPermissions")):
                cidrs = [r.get("cidrIp") for r in items(perm.get("ipRanges"))] + [r.get("cidrIpv6") for r in items(perm.get("ipv6Ranges"))]
                if any(c in PUBLIC for c in cidrs):
                    return perm.get("fromPort") or 0
            return None


        def added_all(attr):
            return any(i.get("group") == "all" for i in items((rp.get(attr) or {}).get("add")))


        # Weakens a control but leaves nothing to undo or contain: record it, no LLM needed.
        MONITOR = {"PutBucketVersioning", "PutBucketLogging", "DeleteBucketLogging", "DeleteFlowLogs",
                   "StopConfigurationRecorder", "DeleteConfigurationRecorder", "UpdateTrail", "PutEventSelectors"}
        # Exposes a resource or disables a control that no configured Store action can undo:
        # a person undoes it in AWS. Value: the request parameter naming the resource.
        NO_ACTION = {"DeleteTrail": "name", "DeleteDetector": "detectorId", "UpdateIPSet": "ipSetId", "SetRepositoryPolicy": "repositoryName",
                     "PutResourcePolicy": "policyName", "PutIdentityPolicy": "identity",
                     "PutApplicationPolicy": "applicationId", "AddLayerVersionPermission": "layerName",
                     "PutAccountPublicAccessBlock": "accountId", "DeleteAccountPublicAccessBlock": "accountId",
                     "DeleteAccountPasswordPolicy": "", "EnableSerialConsoleAccess": ""}
        # Done with the caller's own credentials and never routine: deny the caller.
        CONTAIN_CALLER = {"GetFederationToken", "LeaveOrganization", "TransferDomainToAnotherAwsAccount"}
        # Rules on the caller's client, not the call (any API call can fire them; matched on the detection name).
        # Attack OS or tooling: deny the caller after approval.
        SUSPECT_CLIENT = ("hacking-related operating system", "Tool usage: ScoutSuite", "Tool usage: CloudBerry")
        # Recon, informational by default: let the LLM judge whether to contain the caller.
        JUDGE = ("Potential discovery of Admin accounts",)
        # An admin role on an instance: often deliberate, and stopping the instance or removing the role
        # could break a workload. Open a case instead of skipping it.
        REVIEW = ("EC2 Instance Associated with Admin Role", "EC2 Instance Created with Admin Role")


        def contain_caller():
            """Deny the IAM user or role that made the call. Never a shared SSO role."""
            if ui.get("type") == "IAMUser":
                return "iam-apply-deny-policy-user", ui.get("userName"), "", 0
            role = caller.split("/")[-2] if ui.get("type") == "AssumedRole" else ""
            if role.startswith("AWSReservedSSO_"):
                return "escalate-human", "-", f"{name} by shared SSO role {role}", 0
            if role:
                return "iam-role-apply-deny-policy", role, "", 0
            return None


        def undo():
            """The exact undo of a successful API call, else None."""
            if name == "AuthorizeSecurityGroupIngress" and public_port() is not None:
                return "sg-revoke-ingress", rp.get("groupId"), "", public_port()
            if name == "ModifySnapshotAttribute" and added_all("createVolumePermission"):
                return "remove-public-snapshot", rp.get("snapshotId"), "", 0
            if name == "ModifyImageAttribute" and added_all("launchPermission"):
                return "ami-make-private", rp.get("imageId"), "", 0
            if name == "ModifyDBSnapshotAttribute" and "all" in (rp.get("valuesToAdd") or []):
                return "rds-snapshot-private", rp.get("dBSnapshotIdentifier"), "", 0
            if name in ("PutBucketAcl", "PutBucketPolicy", "DeleteBucketPublicAccessBlock"):
                return "s3-block-public-access", rp.get("bucketName"), "", 0
            if name == "PutFileSystemPolicy":
                return "efs-remove-public-access", rp.get("fileSystemId"), "", 0
            if api == "AddPermission" and source == "lambda.amazonaws.com" and rp.get("principal") == "*":
                return "lambda-disable", rp.get("functionName"), "", 0
            # SNS: put back the default owner-only topic policy (the old one is on the case).
            if (name == "SetTopicAttributes" and rp.get("attributeName") == "Policy") or (name == "AddPermission" and source == "sns.amazonaws.com"):
                return "sns-reset-topic-policy", rp.get("topicArn"), "", 0
            if name == "StopLogging":
                return "cloudtrail-start-logging", rp.get("name"), "", 0
            if name == "UpdateDetector" and rp.get("enable") is False:
                return "guardduty-enable-detector", rp.get("detectorId"), "", 0
            if name == "CreateIPSet":
                return "guardduty-delete-ipset", rp.get("detectorId"), re_.get("ipSetId"), 0
            for kind in ("User", "Role", "Group"):
                if name == f"Attach{kind}Policy":
                    return f"iam-detach-{kind.lower()}-policy", rp.get(f"{kind.lower()}Name"), rp.get("policyArn"), 0
                if name == f"Put{kind}Policy":
                    return f"iam-delete-{kind.lower()}-policy", rp.get(f"{kind.lower()}Name"), rp.get("policyName"), 0
            # A root user's own key can't be disabled through IAM (no userName in the request).
            if name == "CreateAccessKey" and (rp.get("userName") or ui.get("type") != "Root"):
                key = re_.get("accessKey") or {}
                return "iam-disable-access-key", key.get("userName"), key.get("accessKeyId"), 0
            if name in ("CreateLoginProfile", "UpdateLoginProfile"):
                return "iam-delete-login-profile", rp.get("userName"), "", 0
            if name == "UpdateAssumeRolePolicy":
                return "iam-role-apply-deny-policy", rp.get("roleName"), "", 0
            return None


        def table():
            """(action, target, detail, port) for API calls with one obvious response, else None."""
            if name in MONITOR:
                return "monitor-only", "-", "", 0
            if api in NO_ACTION:
                return "escalate-human", "-", f"{name} {rp.get(NO_ACTION[api]) or ''}".strip(), 0
            if any(s in detection for s in SUSPECT_CLIENT):
                return contain_caller() or ("escalate-human", "-", f"{detection}: {name} by {ui.get('type')}", 0)
            if any(s in detection for s in REVIEW):
                return "monitor-only", "-", "", 0
            if name in CONTAIN_CALLER:
                return contain_caller()
            fixed = None if e.get("errorCode") else undo()  # a failed call left nothing to undo
            if fixed:
                return fixed
            if ui.get("type") == "Root":
                return "escalate-human", "-", f"{name} by the root user", 0
            # Instance credentials used for IAM or console activity: contain the instance role.
            session = caller.rsplit("/", 1)[-1]
            if ui.get("type") == "AssumedRole" and session.startswith("i-"):
                return "iam-role-apply-deny-policy", caller.split("/")[-2], "", 0
            return None


        trimmed = {"eventName": name, "eventSource": e.get("eventSource"), "awsRegion": e.get("awsRegion"),
                   "sourceIPAddress": e.get("sourceIPAddress"), "errorCode": e.get("errorCode"),
                   "userIdentity": {k: ui.get(k) for k in ("type", "arn", "userName", "accessKeyId") if ui.get(k)},
                   "requestParameters": rp or None, "responseElements": re_ or None}
        event = json.dumps({k: v for k, v in trimmed.items() if v}, separators=(",", ":"))

        fixed = table()
        note = ""
        region = e.get("awsRegion") or "us-east-1"
        if fixed and fixed[0] in ACCOUNT_BOUND and BOUND is not None:
            app, fallback = ACCOUNT_BOUND[fixed[0]]
            where = account if app == "IAM" else f"{account}:{region}"
            if where not in BOUND.get(app, []):
                app_name = {"IAM": "AWS IAM", "CLOUDTRAIL": "AWS CloudTrail", "GUARDDUTY": "AWS GuardDuty"}[app]
                note = f"; {fixed[0]} needs an {app_name} config for {where.replace(':', ' ')}, so {fallback} instead"
                fixed = (fallback, fixed[1] if fallback != "escalate-human" else "-", "" if fallback != "escalate-human" else f"{name} {fixed[1]}", 0)
        if "CrowdStrikeAutomatedResponse" in caller:
            route, fixed, check = "skip", None, "made by the CrowdStrike response role"
        elif fixed and fixed[0] == "escalate-human":
            route, check = "table", f"a person needs to act on {name}" + (note or ": no safe response action")
        elif fixed and fixed[1]:
            route, check = "table", f"target read from the {name} event{note}"
        elif severity == "Informational" and not any(s in detection for s in JUDGE):
            route, check = "skip", "informational detection with no fixed response"
        else:
            route, fixed, check = "llm", None, ""
        action, target, detail, port = fixed or ("", "", "", 0)
        auto = "yes" if route == "table" and action in AUTO else "no"
        fields = [route, action, target or "", detail or "", port or 0, region, auto, check]
        print("|".join(str(f).replace("|", "") for f in fields) + "#EVENT#" + event, end="")
  SetRoute:
    id: 6c6eab39063fa3b72d98c82af60deb8a
    class: UpdateVariable
    name: Set route
    version_constraint: ~1
    next:
    - is_table
    - is_llm
    properties:
      WorkflowCustomVariable:
        Route: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[0]}
        Action: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[1]}
        Target: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[2]}
        Detail: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[3]}
        Port: ${int(data['Route.output_stdout'].split('#EVENT#')[0].split('|')[4])}
        Region: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[5]}
        AutoRun: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[6]}
        Check: ${data['Route.output_stdout'].split('#EVENT#')[0].split('|')[7]}
        Confidence: high
        Why: Fixed response for this API call
        Event: ${data['Route.output_stdout'].split('#EVENT#')[1]}
  RecommendAction:
    id: bdfecafafdb44919a458fcf51d6b93a7_98dec86072334d24b37dd798098cfd63
    name: Charlotte AI - LLM Completion
    version_constraint: ~0
    next:
    - ParseRecommendation
    properties:
      model_name: Claude Latest
      temperature: 0
      user_prompt: 'Pick ONE response for this CrowdStrike cloud detection in AWS. An analyst approves it before it runs.

        iam-disable-access-key [user owning the abused access key; also give access_key_id]

        iam-apply-deny-policy-user [IAM user acting maliciously]

        iam-role-apply-deny-policy [IAM role acting maliciously or being abused]

        monitor-only [low risk, or nothing to contain]

        escalate-human [unclear target, or needs investigation first]

        Copy the target exactly from the event.


        Detection: ${Trigger.Detection.Name}

        Event: ${WorkflowCustomVariable.Event}


        Reply with only JSON: {"action":"","target":"","access_key_id":"","confidence":"high|medium|low","why":"<=15 words"}'
  ParseRecommendation:
    id: 7fb9eb10b23943efaf1e6082b0ac0338
    name: Parse and check recommendation
    version_constraint: ~1
    next:
    - SetRecommendation
    properties:
      runtime: py0313general
      script: |
        import json

        ACTIONS = {"iam-disable-access-key", "iam-apply-deny-policy-user", "iam-role-apply-deny-policy", "monitor-only", "escalate-human"}
        text = r'''${RecommendAction.FaaS.nlpassistantapi.llminvocator_handler.completion}'''
        event = r'''${WorkflowCustomVariable.Event}'''
        try:
            r = json.loads(text[text.index("{"):text.rindex("}") + 1])
        except ValueError:
            r = {}
        action = r.get("action") if r.get("action") in ACTIONS else "escalate-human"
        target, key = str(r.get("target") or ""), str(r.get("access_key_id") or "")
        confidence = r.get("confidence")
        if isinstance(confidence, (int, float)):  # the model sometimes answers 0.9
            confidence = "high" if confidence >= 0.8 else "medium" if confidence >= 0.5 else "low"
        # Deterministic guard: the target (and key) must appear verbatim in the CloudTrail event.
        needed = [t for t in (target, key if action == "iam-disable-access-key" else "") if t]
        if action in ("monitor-only", "escalate-human"):
            check = "no target needed"
        elif action == "iam-role-apply-deny-policy" and target.startswith("AWSReservedSSO_"):
            # Shared Identity Center role: denying it locks out every user of that permission set.
            action, check = "escalate-human", f"won't deny shared SSO role {target}"
        elif needed and all(t in event for t in needed):
            check = "target found in the event"
        else:
            action, check = "escalate-human", f"LLM target {target} {key} not found in the event"
        why = str(r.get("why") or "").replace("\n", " ")
        fields = [action, target, key, str(confidence or "low").lower(), why, check]
        print("|".join(f.replace("|", "") for f in fields), end="")
  SetRecommendation:
    id: 6c6eab39063fa3b72d98c82af60deb8a
    class: UpdateVariable
    name: Set recommendation
    version_constraint: ~1
    next:
    - CreateCase
    properties:
      WorkflowCustomVariable:
        Action: ${data['ParseRecommendation.output_stdout'].split('|')[0]}
        Target: ${data['ParseRecommendation.output_stdout'].split('|')[1]}
        Detail: ${data['ParseRecommendation.output_stdout'].split('|')[2]}
        Confidence: ${data['ParseRecommendation.output_stdout'].split('|')[3]}
        Why: ${data['ParseRecommendation.output_stdout'].split('|')[4]}
        Check: ${data['ParseRecommendation.output_stdout'].split('|')[5]}
        AutoRun: 'no'
  CreateCase:
    id: 4918bf9d85ecc06388eca16543bdbbdc
    name: Create a new Case
    version_constraint: ~1
    next:
    - is_auto
    - is_needs_approval
    properties:
      name: 'CDR ${Trigger.Detection.Name}: ${WorkflowCustomVariable.Action} ${WorkflowCustomVariable.Target}'
      severity: '${{''Critical'': ''90'', ''High'': ''70'', ''Medium'': ''50'', ''Low'': ''30'', ''Informational'': ''10''}[data[''Trigger.Detection.SeverityDisplayName'']]}'
      status: new
      detections:
      - ${Trigger.Detection.DetectionID}
      tags:
      - cdr-soar
      description: '## Response


        **Action:** ${WorkflowCustomVariable.Action}


        **Target:** ${WorkflowCustomVariable.Target} ${WorkflowCustomVariable.Detail}


        **Decided by:** ${WorkflowCustomVariable.Route} (confidence ${WorkflowCustomVariable.Confidence}). ${WorkflowCustomVariable.Why}


        **Check:** ${WorkflowCustomVariable.Check}


        **Runs:** ${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''automatically'' : ''after approval by __APPROVER_EMAIL__
        (containment actions only)''}


        Account ${Trigger.Detection.FCS.CloudAccountId}, region ${WorkflowCustomVariable.Region}.


        ## Event


        ```json

        ${WorkflowCustomVariable.Event}

        ```'
  RequestApproval:
    id: d6731c10b24834e2e0f4bd9d390a29c8
    name: Request human input - Send email
    version_constraint: ~1
    next:
    - is_approved
    - is_declined
    properties:
      to:
      - __APPROVER_EMAIL__
      responders:
      - __APPROVER_EMAIL__
      user_input_timeout: 24h
      allowed_responses:
      - Approve
      - Decline
      msg_type: text
      subject: 'Approve CDR response: ${WorkflowCustomVariable.Action} on ${WorkflowCustomVariable.Target}'
      msg: 'Falcon Cloud Security detected "${Trigger.Detection.Name}" in AWS account ${Trigger.Detection.FCS.CloudAccountId}.


        Action: ${WorkflowCustomVariable.Action}

        Target: ${WorkflowCustomVariable.Target} ${WorkflowCustomVariable.Detail}

        Region: ${WorkflowCustomVariable.Region}

        Decided by: ${WorkflowCustomVariable.Route} (${WorkflowCustomVariable.Confidence}). ${WorkflowCustomVariable.Why}

        Check: ${WorkflowCustomVariable.Check}


        Approve to run it now. Details are on case ${data[''CreateCase.id'']}.'
  CommentNotApproved:
    id: a16f4fdd1b244b0bfeecd47e25dbe0e0
    name: Add Comment to Case
    version_constraint: ~1
    properties:
      case_id: ${data['CreateCase.id']}
      comment: 'Recommended ${WorkflowCustomVariable.Action} was not run: declined by ${data[''RequestApproval.result.responder'']}.
        ${data[''RequestApproval.result.note'']}'
  RespondIAM:
    id: __WORKFLOW_cdr-respond-iam__
    name: CDR respond - IAM
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
  RespondEC2:
    id: __WORKFLOW_cdr-respond-ec2__
    name: CDR respond - EC2
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
  RespondData:
    id: __WORKFLOW_cdr-respond-data__
    name: CDR respond - data stores
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
  RespondControls:
    id: __WORKFLOW_cdr-respond-controls__
    name: CDR respond - logging and detection
    properties:
      action: ${WorkflowCustomVariable.Action}
      target: ${WorkflowCustomVariable.Target}
      detail: ${WorkflowCustomVariable.Detail}
      region: ${WorkflowCustomVariable.Region}
      port: ${WorkflowCustomVariable.Port}
      account_id: ${Trigger.Detection.FCS.CloudAccountId}
      case_id: ${data['CreateCase.id']}
      mode: '${data[''WorkflowCustomVariable.AutoRun''] == ''yes'' ? ''Ran automatically'' : ''Approved by an analyst''}'
conditions:
  is_aws_cloud_ioa:
    next:
    - CreateVariable
    expression: Trigger.Detection.FCS.DetectType:'cloud-ioa'+Trigger.Detection.FCS.ServiceProvider:'aws'
    display:
    - AWS cloud IOA detection
  is_table:
    next:
    - CreateCase
    expression: WorkflowCustomVariable.Route:'table'
    display:
    - Fixed response for this API call
  is_llm:
    next:
    - RecommendAction
    expression: WorkflowCustomVariable.Route:'llm'
    display:
    - Needs a judgment call
  is_auto:
    next: &id001
    - is_iam_response
    - is_ec2_response
    - is_data_response
    - is_controls_response
    expression: WorkflowCustomVariable.AutoRun:'yes'
    display:
    - Safe to run automatically
  is_needs_approval:
    next:
    - RequestApproval
    expression: WorkflowCustomVariable.AutoRun:'no'+WorkflowCustomVariable.Action:!'monitor-only'+WorkflowCustomVariable.Action:!'escalate-human'
    display:
    - Containment action that needs approval
  is_approved:
    next: *id001
    expression: RequestApproval.result.user_response:'Approve'
    display:
    - Approved
  is_declined:
    next:
    - CommentNotApproved
    expression: RequestApproval.result.user_response:'Decline'
    display:
    - Declined
  is_iam_response:
    next:
    - RespondIAM
    expression: WorkflowCustomVariable.Action:['iam-disable-access-key', 'iam-apply-deny-policy-user', 'iam-role-apply-deny-policy',
      'iam-detach-user-policy', 'iam-detach-role-policy', 'iam-detach-group-policy', 'iam-delete-user-policy', 'iam-delete-role-policy',
      'iam-delete-group-policy', 'iam-delete-login-profile']
    display:
    - IAM action
  is_ec2_response:
    next:
    - RespondEC2
    expression: WorkflowCustomVariable.Action:['sg-revoke-ingress', 'remove-public-snapshot', 'ami-make-private']
    display:
    - EC2 action
  is_data_response:
    next:
    - RespondData
    expression: WorkflowCustomVariable.Action:['s3-block-public-access', 'lambda-disable', 'efs-remove-public-access', 'rds-snapshot-private',
      'sns-reset-topic-policy']
    display:
    - data stores action
  is_controls_response:
    next:
    - RespondControls
    expression: WorkflowCustomVariable.Action:['cloudtrail-start-logging', 'guardduty-enable-detector', 'guardduty-delete-ipset']
    display:
    - logging and detection action
